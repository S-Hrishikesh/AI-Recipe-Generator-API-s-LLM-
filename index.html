<!DOCTYPE html>
<html lang="en">
    <head>
            <style>
                :root {
                --primary-color: #4f46e5;
                --primary-hover: #4338ca;
                --bg-color: #f8fafc;
                --card-bg: #ffffff;
                --text-main: #1e293b;
                --border-color: #e2e8f0;
            }

            body {
                font-family: system-ui, -apple-system, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                display: flex;
                justify-content: center;
                padding: 2rem 1rem;
                margin: 0;
            }
            .container {
                background-color: var(--card-bg);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                width: 100%;
                max-width: 600px; 
            }

            h1{
                margin-top: 0;
                text-align: center;
                font-size: 1.75rem;
                margin-bottom: 1.5rem;
            }
            textarea {
                width: 100%;
                min-height: 120px;
                padding: 1rem;
                border: 1px solid var(--border-color);
                border-radius: 8px;
                font-family: inherit;
                font-size: 1rem;
                margin-bottom: 1rem;
                box-sizing: border-box;
                resize: vertical;
                transition: border-color 0.2s;
            }
            textarea:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            }

            button {
                width: 100%;
                background-color: var(--primary-color);
                color: white;
                border: none;
                padding: 0.875rem;
                font-size: 1rem;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            button:hover {
                background-color: var(--primary-hover);
            }
            #Output{
                margin-top: 1.5rem;
                padding: 1rem;
                background-color: var(--bg-color);
                border-radius: 8px;
                border: 1px solid var(--border-color);
                line-height: 1.6;
                min-height: 80px;
                white-space: pre-wrap;
            }
        </style>
        <title>AI RECIPE Generator</title>
    </head>
    <body>
        <div class="container">
            <textarea id="recipeInput" placeholder="Enter the ingredients you have..."></textarea>
            <button id="generateRecipe">Generate with AI</button>
            <div id="Output">

            </div>
            <script src="app.js"></script>
        </div>
    </body>
</html>
